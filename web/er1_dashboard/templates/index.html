<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>ER1 Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page">
    <section class="panel unified-row">
      <div class="unified-grid">
        <div class="phase-panel">
          <div class="label">Phase <span id="phaseValue" class="value inline-phase">0: Standby</span></div>
          <div class="subline">Last: <span id="lastPhaseValue">—</span></div>
          <div class="top-nav-links"><a class="nav-button" href="/games">Open Game Viewer</a></div>
          <div class="mode-buttons">
            <button data-phase-action="standby">Standby</button>
            <button data-phase-action="maintenance">Maintenance</button>
            <button data-phase-action="prepare">Prepare</button>
            <button data-phase-action="start">Start</button>
          </div>
          <div class="players-inline">
            <div class="label small-label">Anzahl Spieler <span id="playersCountStored" class="players-count-stored">(gespeichert: 0)</span></div>
            <div class="players-count-controls">
              <input id="playersCountInput" class="players-count-input" type="text" inputmode="numeric" value="0" />
              <button id="playersCountSave" type="button" class="players-count-save">Spieleranzahl speichern</button>
            </div>
          </div>
        </div>

        <div class="timer-panel">
          <div class="label">Game Timer</div>
          <div id="timerValue" class="value timer compact-timer">00:00:00</div>
          <div class="label small-label">Current riddle</div>
          <div id="riddleTimerValue" class="value sub-timer">00:00:00</div>
        </div>

        <div class="stacked-controls">
          <section class="subpanel compact-panel controls-borderless">
            <h2>Lights</h2>
            <div id="lightsGrid" class="controls-grid"></div>
          </section>
          <section class="subpanel compact-panel controls-borderless">
            <h2>Locks</h2>
            <div id="locksGrid" class="controls-grid"></div>
          </section>
        </div>

        <div class="nodes-panel">
          <div class="label">Controllers / Nodes</div>
          <div id="nodesList" class="nodes-list nodes-two-col"></div>
        </div>
      </div>
    </section>

    <section class="panel riddles-panel">
      <h2>Riddles</h2>
      <div class="riddles-halves">
        <table class="simple-table riddles-table compact-riddles-table">
          <thead>
            <tr>
              <th>Riddle</th>
              <th>Phase</th>
              <th>Solve</th>
              <th>Info</th>
              <th>Hints</th>
            </tr>
          </thead>
          <tbody id="riddlesBodyLeft"></tbody>
        </table>

        <table class="simple-table riddles-table compact-riddles-table">
          <thead>
            <tr>
              <th>Riddle</th>
              <th>Phase</th>
              <th>Solve</th>
              <th>Info</th>
              <th>Hints</th>
            </tr>
          </thead>
          <tbody id="riddlesBodyRight"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
