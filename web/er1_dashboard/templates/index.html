<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>ER1 Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page">
    <section class="panel top-panel">
      <div class="top-grid">
        <div class="phase-box">
          <div class="label">Phase</div>
          <div id="phaseValue" class="value big">1 standby</div>
          <div class="subline">Last: <span id="lastPhaseValue">—</span></div>
          <div class="mode-buttons">
            <button data-phase-action="standby">Standby</button>
            <button data-phase-action="maintenance">Maintenance</button>
            <button data-phase-action="prepare">Prepare</button>
            <button data-phase-action="start">Start</button>
          </div>
        </div>

        <div class="players-box">
          <div class="label">Players</div>
          <input id="playerInput" class="player-input" type="text" placeholder="Type player name and press Enter" />
          <div id="playersList" class="players-list"></div>
        </div>
      </div>
    </section>

    <section class="workspace">
      <div class="left-stack">
        <section class="panel compact-panel">
          <h2>Locks</h2>
          <div id="locksGrid" class="controls-grid"></div>
        </section>

        <section class="panel compact-panel">
          <h2>Lights</h2>
          <div id="lightsGrid" class="controls-grid"></div>
        </section>
      </div>

      <div class="right-stack">
        <section class="panel nodes-panel">
          <h2>Nodes</h2>
          <table class="simple-table nodes-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="nodesBody"></tbody>
          </table>
        </section>

        <section class="panel riddles-panel">
          <h2>Riddles</h2>
          <table class="simple-table riddles-table">
            <thead>
              <tr>
                <th>Riddle</th>
                <th>Phase</th>
                <th>Node</th>
                <th>Solve</th>
                <th>Tries</th>
                <th>Info</th>
                <th>Hints</th>
              </tr>
            </thead>
            <tbody id="riddlesBody"></tbody>
          </table>
        </section>
      </div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
