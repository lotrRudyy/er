<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>ER1 Game Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page viewer-page">
    <section class="panel viewer-topbar">
      <div>
        <div class="label">Game Viewer</div>
        <div class="subline">Enter a game id and load all saved data from the SQLite database.</div>
      </div>
      <div class="nav-buttons">
        <a class="nav-button" href="{{ url_for('index') }}">Open Dashboard</a>
      </div>
    </section>

    <section class="panel viewer-search-panel">
      <div class="viewer-search-row">
        <label class="viewer-search-label" for="gameIdInput">Game ID</label>
        <input id="gameIdInput" class="viewer-search-input" type="text" placeholder="Paste game id here" />
        <button id="loadGameBtn" class="viewer-load-button">Load Game</button>
      </div>
      <div id="viewerStatus" class="viewer-status">Waiting for input.</div>
    </section>

    <section id="viewerContent" class="viewer-content" hidden>
      <section class="panel">
        <h2>Game Summary</h2>
        <div id="gameSummaryGrid" class="viewer-summary-grid"></div>
      </section>

      <section class="panel">
        <h2>Riddles</h2>
        <table class="simple-table viewer-table">
          <thead>
            <tr>
              <th>Riddle</th>
              <th>Source</th>
              <th>Activated</th>
              <th>Solved At</th>
              <th>Solved</th>
              <th>Run Time</th>
              <th>Activation Time</th>
            </tr>
          </thead>
          <tbody id="viewerRiddlesBody"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Hints</h2>
        <table class="simple-table viewer-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>At</th>
              <th>Riddle</th>
              <th>Hint</th>
            </tr>
          </thead>
          <tbody id="viewerHintsBody"></tbody>
        </table>
      </section>
    </section>
  </div>

  <script src="{{ url_for('static', filename='game_viewer.js') }}"></script>
</body>
</html>
